<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lola Logistics | System</title> <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root {
            /* Fun & Colorful Palette */
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            --bg-body: #f3f4f6;
            
            --color-primary: #8B5CF6; /* Violet */
            --color-secondary: #EC4899; /* Pink */
            --color-accent: #F59E0B; /* Amber */
            --color-success: #10B981; /* Emerald */
            --color-text: #1f2937;
            
            --glass: rgba(255, 255, 255, 0.7);
            --shadow-fun: 0 10px 25px -5px rgba(139, 92, 246, 0.15), 0 8px 10px -6px rgba(139, 92, 246, 0.1);
        }

        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; outline: none; }

        body { 
            margin: 0; 
            background-image: linear-gradient( 109.6deg,  rgba(255,238,221,1) 11.2%, rgba(230,240,255,1) 91.1% );
            color: var(--color-text); height: 100vh; display: flex; overflow: hidden; 
        }

        /* --- Animations --- */
        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            60% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); }
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 290px; background: rgba(255,255,255,0.6); backdrop-filter: blur(20px);
            border-right: 1px solid white; margin: 20px; border-radius: 30px;
            display: flex; flex-direction: column; padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05); z-index: 10;
        }
        .logo-area { 
            margin-bottom: 40px; display: flex; align-items: center; gap: 15px; 
            font-size: 1.6rem; font-weight: 900; color: #4c1d95; 
        }
        .logo-icon {
            width: 50px; height: 50px; background: linear-gradient(135deg, #a78bfa, #8b5cf6);
            border-radius: 18px; display: flex; align-items: center; justify-content: center;
            color: white; box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3); transform: rotate(-5deg);
        }
        .nav-menu { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        .nav-btn {
            background: transparent; border: none; color: #6b7280;
            padding: 15px 20px; border-radius: 20px; cursor: pointer;
            text-align: right; font-size: 1.1rem; font-weight: 700;
            display: flex; align-items: center; gap: 15px; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .nav-btn:hover { background: white; color: var(--color-primary); transform: translateX(-5px) scale(1.02); }
        .nav-btn.active { 
            background: white; color: var(--color-primary); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); 
        }
        .nav-btn i { font-size: 1.3rem; }

        /* --- Main Content --- */
        .main-content { flex: 1; display: flex; flex-direction: column; padding: 20px 20px 20px 0; }
        .top-bar { 
            height: 90px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; 
            background: rgba(255,255,255,0.4); backdrop-filter: blur(10px); border-radius: 25px; margin-bottom: 20px;
        }
        
        .search-box { position: relative; width: 380px; }
        .search-box input {
            width: 100%; padding: 15px 20px 15px 55px; border-radius: 25px; border: 2px solid transparent;
            background: white; font-size: 1rem; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            font-weight: 600; color: #4b5563;
        }
        .search-box input:focus { border-color: #c4b5fd; box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1); }
        .search-box i { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: #a78bfa; font-size: 1.2rem; }

        .btn-base {
            padding: 12px 25px; border-radius: 25px; font-weight: 800; cursor: pointer; border: none;
            display: flex; align-items: center; gap: 10px; font-size: 1rem; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-base:hover { transform: translateY(-3px); }
        .btn-add {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: white;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
        }
        .btn-sheet {
            background: linear-gradient(135deg, #10b981, #059669); color: white;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        .list-container { flex: 1; overflow-y: auto; padding-right: 10px; }
        .list-container::-webkit-scrollbar { width: 8px; }
        .list-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* --- Order Row (Card) --- */
        .order-row {
            background: rgba(255,255,255,0.85); border: 3px solid white; border-radius: 30px;
            box-shadow: var(--shadow-fun); margin-bottom: 25px; transition: 0.4s; overflow: hidden;
            animation: bounceIn 0.5s ease forwards;
        }
        .order-row:hover { transform: scale(1.01); box-shadow: 0 20px 40px rgba(139, 92, 246, 0.15); border-color: #e9d5ff; }

        .row-header {
            padding: 25px 35px; display: grid; grid-template-columns: 1.5fr 1fr 1.2fr 1.5fr 50px;
            align-items: center; cursor: pointer; gap: 15px;
        }
        .client-txt { font-weight: 900; font-size: 1.2rem; color: #4c1d95; display: block; margin-bottom: 5px; }
        .ref-txt { 
            font-size: 0.85rem; color: #db2777; background: #fce7f3; 
            padding: 5px 12px; border-radius: 12px; font-weight: 800; display: inline-block;
        }
        
        .status-badge {
            padding: 8px 15px; border-radius: 20px; font-size: 0.85rem; font-weight: 800; text-align: center;
            display: inline-flex; align-items: center; gap: 6px; width: fit-content;
        }
        .badge-active { background: #fffbeb; color: #d97706; border: 2px solid #fcd34d; }
        .badge-done { background: #ecfdf5; color: #059669; border: 2px solid #6ee7b7; }

        /* New Badges for Date & Role */
        .info-badge {
            display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 700; color: #4b5563;
            background: #f3f4f6; padding: 6px 12px; border-radius: 15px; margin-top: 5px; width: fit-content;
        }
        .info-badge i { color: #8b5cf6; }

        .role-badge {
            background: #e0e7ff; color: #4338ca; padding: 6px 12px; border-radius: 15px;
            font-size: 0.85rem; font-weight: 800; display: inline-flex; align-items: center; gap: 6px;
            border: 1px solid #c7d2fe;
        }
        .role-badge i { color: #4338ca; }
        
        .archive-badge {
            background: #f0fdf4; color: #15803d; padding: 6px 12px; border-radius: 15px;
            font-size: 0.85rem; font-weight: 800; display: inline-flex; align-items: center; gap: 6px;
            border: 1px solid #bbf7d0;
        }

        .countdown-badge {
            display: inline-block; padding: 4px 10px; border-radius: 10px; font-size: 0.8rem; font-weight: 800;
        }
        .count-late { background: #ffe4e6; color: #be123c; }
        .count-normal { background: #eff6ff; color: #2563eb; }

        .row-details { max-height: 0; overflow: hidden; transition: max-height 0.6s ease; background: #f8fafc; }
        .order-row.expanded .row-details { max-height: 1000px; }
        .details-content { padding: 30px 40px; }

        .h-timeline {
            display: flex; justify-content: space-between; position: relative; margin: 40px 0;
        }
        .h-timeline::before {
            content: ''; position: absolute; top: 30px; left: 40px; right: 40px; height: 6px; 
            background: #e2e8f0; border-radius: 10px; z-index: 0;
        }
        
        .h-step { position: relative; z-index: 1; text-align: center; width: 14%; display: flex; flex-direction: column; align-items: center; }
        .icon-circle {
            width: 60px; height: 60px; border-radius: 50%; background: white; border: 4px solid #e2e8f0;
            display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: #cbd5e1;
            transition: 0.4s; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .h-step.completed .icon-circle { 
            background: #10b981; border-color: #10b981; color: white; transform: scale(1.1); 
            animation: bounceIn 0.4s;
        }
        .h-step.current .icon-circle { 
            background: white; border-color: #f59e0b; color: #f59e0b; transform: scale(1.2); 
            box-shadow: 0 0 0 6px rgba(245, 158, 11, 0.2);
        }
        .h-title { font-weight: 800; color: #64748b; font-size: 0.9rem; }
        .h-role { background: #e0e7ff; color: #4338ca; padding: 3px 10px; border-radius: 10px; font-size: 0.75rem; font-weight: 700; margin-top: 5px; }

        .file-link {
            background: #fdf2f8; color: #db2777; padding: 4px 10px; border-radius: 8px;
            font-size: 0.75rem; font-weight: 700; margin-top: 4px; cursor: pointer; text-decoration: none;
            display: flex; align-items: center; gap: 5px; transition: 0.2s; border: 1px solid #fce7f3;
        }
        .file-link:hover { background: #db2777; color: white; }

        .action-bar { display: flex; justify-content: flex-end; gap: 15px; margin-top: 30px; padding-top: 20px; border-top: 2px dashed #e2e8f0; }
        .btn-action-do {
            background: linear-gradient(135deg, #f59e0b, #d97706); color: white; border:none;
            padding: 12px 30px; border-radius: 20px; font-weight: 800; cursor: pointer;
            box-shadow: 0 10px 20px rgba(245, 158, 11, 0.3); transition: 0.3s;
        }
        .btn-action-do:hover { transform: translateY(-3px) scale(1.05); }

        /* Spreadsheet */
        .spreadsheet-overlay {
            position: fixed; inset: 0; background: rgba(255,255,255,0.95); z-index: 200; display: none;
            flex-direction: column; backdrop-filter: blur(10px); animation: bounceIn 0.3s ease;
        }
        .sheet-header {
            padding: 20px 40px; background: white; border-bottom: 2px solid #f3f4f6;
            display: flex; justify-content: space-between; align-items: center;
        }
        .custom-table {
            width: 100%; border-collapse: separate; border-spacing: 0; background: white;
            border-radius: 20px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            border: 2px solid #f3f4f6;
        }
        .custom-table th {
            padding: 20px; text-align: right; color: #4c1d95; background: #f5f3ff;
            font-weight: 900; border-bottom: 2px solid #ddd6fe;
        }
        .custom-table td { padding: 15px 20px; border-bottom: 1px solid #f3f4f6; color: #374151; font-weight: 600; }
        .custom-table tr:hover td { background: #fffbe7; }

        /* Modals */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(76, 29, 149, 0.4); backdrop-filter: blur(5px);
            z-index: 300; display: none; align-items: center; justify-content: center;
        }
        .modal-box {
            background: white; width: 550px; border-radius: 35px; overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.2); animation: bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-head {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed); padding: 25px;
            display: flex; justify-content: space-between; align-items: center; color: white;
        }
        .modal-body { padding: 35px; }
        .inp-field {
            width: 100%; padding: 15px; border: 2px solid #e5e7eb; border-radius: 18px;
            margin-bottom: 20px; font-size: 1rem; transition: 0.3s; background: #f9fafb;
        }
        .inp-field:focus { border-color: #8b5cf6; background: white; box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1); }
        .btn-save {
            width: 100%; padding: 18px; background: #111827; color: white; border:none;
            border-radius: 20px; font-weight: 800; font-size: 1.1rem; cursor: pointer;
            transition: 0.3s;
        }
        .btn-save:hover { background: #4c1d95; transform: translateY(-3px); }

        .btn-xls {
            background: #d1fae5; color: #065f46; border: 2px solid #34d399;
            padding: 10px 20px; border-radius: 15px; font-weight: 800; cursor: pointer;
            display: flex; align-items: center; gap: 8px; transition: 0.3s;
        }
        .btn-xls:hover { background: #34d399; color: white; }

        @media(max-width:768px){
            body { flex-direction: column; overflow: auto; }
            .sidebar { width: auto; margin: 10px; height: auto; flex-direction: row; align-items: center; }
            .nav-menu { flex-direction: row; } .nav-btn span { display: none; }
            .top-bar { margin: 10px; flex-wrap: wrap; height: auto; padding: 15px; }
            .search-box { width: 100%; margin-bottom: 10px; }
            .h-timeline { overflow-x: auto; padding-bottom: 20px; justify-content: start; gap: 20px; }
            .h-step { min-width: 100px; }
            .h-timeline::before { width: 600px; }
            .row-header { grid-template-columns: 1fr; gap: 10px; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-cubes"></i></div>
            <span>Lola <span style="color:#d946ef">Logistics</span></span>
        </div>
        
        <nav class="nav-menu">
            <button class="nav-btn active" id="btn-active" onclick="sys.setFilter('active')">
                <i class="fas fa-rocket"></i> <span>جاري العمل</span>
            </button>
            <button class="nav-btn" id="btn-done" onclick="sys.setFilter('done')">
                <i class="fas fa-check-circle"></i> <span>الأرشيف</span>
            </button>
            <button class="nav-btn" onclick="sys.openSettings()">
                <i class="fas fa-sliders-h"></i> <span>الإعدادات</span>
            </button>
        </nav>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search-inp" onkeyup="sys.search()" placeholder="بحث سريع عن طلب...">
            </div>
            
            <div style="display:flex; gap:10px">
                <button class="btn-base btn-sheet" onclick="sys.openSpreadsheet()">
                    <i class="fas fa-table"></i> الجدول
                </button>
                
                <button class="btn-base btn-add" onclick="sys.openNew()">
                    <i class="fas fa-plus"></i> طلب جديد
                </button>
            </div>
        </div>

        <div class="list-container">
            <div id="orders-list" style="display:flex; flex-direction:column;"></div>
        </div>
    </main>

    <div id="spreadsheet-view" class="spreadsheet-overlay">
        <div class="sheet-header">
            <h2 style="color:#4c1d95; margin:0"><i class="fas fa-table" style="color:#d946ef"></i> سجل الطلبات الملون</h2>
            
            <div style="display:flex; gap:15px; align-items:center;">
                <input type="text" id="sheet-search-inp" onkeyup="sys.filterSheet()" placeholder="بحث في الجدول..." style="padding:10px 20px; border-radius:15px; border:2px solid #ddd; width:250px;">
                
                <button onclick="sys.exportExcel()" class="btn-xls">
                    <i class="fas fa-file-excel"></i> تحميل Excel
                </button>

                <button onclick="sys.closeSpreadsheet()" style="background:#fce7f3; color:#be185d; border:none; padding:10px 20px; border-radius:15px; font-weight:800; cursor:pointer;">
                    إغلاق
                </button>
            </div>
        </div>
        <div style="flex:1; overflow:auto; padding:30px;">
            <table class="custom-table" id="export-table">
                <thead>
                    <tr>
                        <th width="50">#</th>
                        <th>العميل</th>
                        <th>رقم PO</th>
                        <th>الموقع</th>
                        <th>التسليم</th>
                        <th>تاريخ الأرشفة</th>
                        <th>الحالة</th>
                        <th>المسؤول</th>
                    </tr>
                </thead>
                <tbody id="sheet-rows"></tbody>
            </table>
        </div>
    </div>

    <div id="modal-order" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-head">
                <h3 id="modal-title" style="margin:0; font-size:1.5rem">بيانات الطلب</h3>
                <i class="fas fa-times" onclick="sys.closeModal('modal-order')" style="cursor:pointer; font-size:1.5rem"></i>
            </div>
            <div class="modal-body">
                <input type="hidden" id="o-id">
                <label style="display:block; font-weight:700; margin-bottom:8px; color:#4b5563">اسم العميل</label>
                <input id="o-client" class="inp-field" placeholder="مثال: شركة النور">
                
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div><label style="display:block; font-weight:700; margin-bottom:8px; color:#4b5563">رقم الـ PO</label><input id="o-ref" class="inp-field" placeholder="PO-XXXX"></div>
                    <div><label style="display:block; font-weight:700; margin-bottom:8px; color:#4b5563">تاريخ التسليم</label><input type="date" id="o-date" class="inp-field"></div>
                </div>

                <label style="display:block; font-weight:700; margin-bottom:8px; color:#4b5563">الموقع</label>
                <input id="o-loc" class="inp-field" placeholder="المدينة - الحي">

                <div id="new-file-sec">
                    <label style="display:block; font-weight:700; margin-bottom:8px; color:#d946ef">📄 ملفات الـ PO (احتفظ بها هنا)</label>
                    <input type="file" id="o-file" class="inp-field" multiple style="border-style:dashed; border-color:#d946ef; background:#fdf2f8">
                </div>
                <button id="btn-save-order" class="btn-save" onclick="sys.saveOrder()">حفظ وانطلاق 🚀</button>
            </div>
        </div>
    </div>

    <div id="modal-act" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-head" style="background:linear-gradient(135deg, #f59e0b, #d97706)">
                <h3 id="act-title" style="margin:0">تنفيذ المرحلة</h3>
                <i class="fas fa-times" onclick="sys.closeModal('modal-act')" style="cursor:pointer; font-size:1.5rem"></i>
            </div>
            <div class="modal-body">
                <div style="background:#fffbeb; padding:20px; border-radius:15px; margin-bottom:20px; border:2px dashed #fcd34d; color:#92400e;">
                    <strong id="act-role" style="display:block; margin-bottom:5px"></strong>
                    <span id="act-desc"></span>
                </div>

                <div id="whs-controls" style="display:none; margin-bottom:20px;">
                    <div class="inp-field" id="opt-no-change" onclick="sys.toggleWhsOpt(true)" style="cursor:pointer; display:flex; align-items:center; gap:10px;">
                        <div style="width:20px; height:20px; border-radius:50%; border:2px solid #ccc;" class="chk"></div>
                        <strong>👍 مطابق تماماً (لا يوجد تغيير)</strong>
                    </div>
                    <div class="inp-field" id="opt-change" onclick="sys.toggleWhsOpt(false)" style="cursor:pointer; display:flex; align-items:center; gap:10px;">
                        <div style="width:20px; height:20px; border-radius:50%; border:2px solid #ccc;" class="chk"></div>
                        <strong>✏️ يوجد تعديل / نواقص</strong>
                    </div>
                </div>

                <div id="act-upload-area">
                    <label style="display:block; font-weight:700; margin-bottom:8px;">إرفاق ملفات المرحلة</label>
                    <input type="file" id="act-file" class="inp-field" multiple>
                </div>
                <button class="btn-save" style="background:#f59e0b; color:white" onclick="sys.submitAct()">تأكيد وإتمام ✅</button>
            </div>
        </div>
    </div>

    <div id="modal-settings" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-head" style="background:#374151">
                <h3 style="margin:0">إعدادات الفريق 🛠️</h3>
                <i class="fas fa-times" onclick="sys.closeModal('modal-settings')" style="cursor:pointer"></i>
            </div>
            <div class="modal-body">
                <label style="display:block; margin-bottom:5px; font-weight:700">فريق المبيعات</label><input id="s-sales" class="inp-field">
                <label style="display:block; margin-bottom:5px; font-weight:700">فريق المحاسبة</label><input id="s-acc" class="inp-field">
                <label style="display:block; margin-bottom:5px; font-weight:700">فريق المستودع</label><input id="s-whs" class="inp-field">
                <button class="btn-save" onclick="sys.saveSettings()">حفظ التعديلات</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        const firebaseConfig = { apiKey: "AIzaSyBB8kMXBgwoPKnsLylktWSWLeM4mX23sJo", authDomain: "blanche-ksa.firebaseapp.com", databaseURL: "https://blanche-ksa-default-rtdb.europe-west1.firebasedatabase.app", projectId: "blanche-ksa", storageBucket: "blanche-ksa.firebasestorage.app", messagingSenderId: "914541537325", appId: "1:914541537325:web:0cfed5799623b14033b0a4", measurementId: "G-M9T5VSCH0P" };
        const app = initializeApp(firebaseConfig); const db = getDatabase(app);

        const STEPS = [
            { title: 'عرض مبدئي', role: 'acc', icon: 'fa-file-invoice-dollar', desc: 'إنشاء ورفع عرض السعر المبدئي.' },
            { title: 'فحص الكميات', role: 'whs', icon: 'fa-box-open', desc: 'مراجعة الكميات واعتمادها.' },
            { title: 'عرض نهائي', role: 'acc', icon: 'fa-calculator', desc: 'إصدار العرض النهائي.' },
            { title: 'تسليم عميل', role: 'whs', icon: 'fa-truck-fast', desc: 'تسليم البضاعة ورفع السند.' },
            { title: 'فاتورة نهائية', role: 'acc', icon: 'fa-receipt', desc: 'إصدار الفاتورة الضريبية.' },
            { title: 'ختم وإغلاق', role: 'whs', icon: 'fa-stamp', desc: 'ختم الفاتورة وإغلاق الطلب.' }
        ];

        window.sys = {
            orders: [],
            roles: { sales: 'المبيعات', acc: 'المحاسبة', whs: 'المستودع' },
            filter: 'active',
            actId: null,
            whsNoChange: false,
            currentSheetList: [],

            init: function() {
                const saved = localStorage.getItem('erp_roles_v3');
                if(saved) this.roles = JSON.parse(saved);
                this.updateMenuUI();
            },
            search: function() { this.render(); },

            formatDateArabic: function(dateStr) {
                if(!dateStr) return 'غير محدد';
                const d = new Date(dateStr);
                return d.toLocaleDateString('ar-EG', { month: 'short', day: 'numeric', year: 'numeric' });
            },

            getRemainingTime: function(dateStr) {
                if(!dateStr) return '';
                const today = new Date(); today.setHours(0,0,0,0);
                const target = new Date(dateStr); target.setHours(0,0,0,0);
                const diffDays = Math.ceil((target - today) / (1000 * 60 * 60 * 24));

                if(diffDays < 0) return `<span class="countdown-badge count-late">⚠️ متأخر ${Math.abs(diffDays)} يوم</span>`;
                if(diffDays === 0) return `<span class="countdown-badge count-late">🚨 اليوم!</span>`;
                if(diffDays === 1) return `<span class="countdown-badge count-late">⚡ غداً</span>`;
                return `<span class="countdown-badge count-normal">⏳ باقي ${diffDays} يوم</span>`;
            },

            // --- Excel Export Only ---
            openSpreadsheet: function() {
                const sheet = document.getElementById('spreadsheet-view');
                document.getElementById('sheet-search-inp').value = ''; 
                this.renderSheetRows(); 
                sheet.style.display = 'flex';
            },
            closeSpreadsheet: function() { document.getElementById('spreadsheet-view').style.display = 'none'; },
            
            filterSheet: function() {
                const term = document.getElementById('sheet-search-inp').value.toLowerCase();
                this.renderSheetRows(term);
            },

            renderSheetRows: function(term = '') {
                const tbody = document.getElementById('sheet-rows');
                tbody.innerHTML = '';
                let list = [...this.orders].sort((a,b) => b.ts - a.ts);
                if(term) list = list.filter(o => o.client.toLowerCase().includes(term) || o.ref.toLowerCase().includes(term));
                this.currentSheetList = list;

                if(list.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:30px; font-weight:bold; color:#ccc">لا توجد نتائج 🌵</td></tr>';
                    return;
                }

                list.forEach((o, idx) => {
                    const isDone = o.status >= 6;
                    const statusTxt = isDone ? 'مكتمل ✅' : STEPS[o.status].title;
                    const roleTxt = isDone ? '-' : this.roles[STEPS[o.status].role];
                    const archivedDate = o.archivedAt ? new Date(o.archivedAt).toLocaleDateString('ar-EG') : '-';
                    
                    const tr = `
                    <tr>
                        <td style="color:#888">${idx + 1}</td>
                        <td style="color:#4c1d95; font-weight:800">${o.client}</td>
                        <td><span style="background:#f3e8ff; color:#7e22ce; padding:3px 8px; border-radius:6px; font-size:0.85rem; font-weight:700">${o.ref}</span></td>
                        <td>${o.loc}</td>
                        <td>${this.formatDateArabic(o.delDate)}</td>
                        <td>${archivedDate}</td>
                        <td><span style="font-weight:700; color:${isDone?'#059669':'#d97706'}">${statusTxt}</span></td>
                        <td>${roleTxt}</td>
                    </tr>`;
                    tbody.insertAdjacentHTML('beforeend', tr);
                });
            },

            exportExcel: function() {
                if(this.currentSheetList.length === 0) return alert("لا يوجد بيانات!");
                const data = this.currentSheetList.map((o, i) => ({
                    "م": i+1, "العميل": o.client, "PO": o.ref, "الموقع": o.loc, 
                    "تاريخ التسليم": this.formatDateArabic(o.delDate),
                    "تاريخ الأرشفة": o.archivedAt ? new Date(o.archivedAt).toLocaleDateString('ar-EG') : 'جاري العمل',
                    "الحالة": o.status >= 6 ? 'مكتمل' : STEPS[o.status].title,
                    "المسؤول": o.status >= 6 ? 'تم' : this.roles[STEPS[o.status].role]
                }));
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "الطلبات");
                XLSX.writeFile(wb, "Fun_Report.xlsx");
            },

            // --- Main Render ---
            render: function() {
                const listEl = document.getElementById('orders-list');
                const term = document.getElementById('search-inp').value.toLowerCase();
                listEl.innerHTML = '';

                let list = this.orders.sort((a,b) => b.ts - a.ts);
                if(term) list = list.filter(o => o.client.toLowerCase().includes(term) || o.ref.toLowerCase().includes(term));
                if(this.filter === 'active') list = list.filter(o => o.status < 6);
                if(this.filter === 'done') list = list.filter(o => o.status >= 6);

                if(list.length === 0) {
                    listEl.innerHTML = `<div style="text-align:center; padding:60px; color:#9ca3af;"><i class="fas fa-ghost fa-3x" style="margin-bottom:15px; display:block; color:#e5e7eb"></i><p>لا يوجد شيء هنا!</p></div>`;
                    return;
                }

                list.forEach(o => {
                    const isDone = o.status >= 6;
                    let timelineHTML = '';
                    
                    // Logic for Action Holder / Archive Date
                    let roleDisplay = '';
                    if(isDone) {
                        const archDate = o.archivedAt ? new Date(o.archivedAt).toLocaleDateString('ar-EG') : 'غير مسجل';
                        roleDisplay = `<div class="archive-badge"><i class="fas fa-calendar-check"></i> أرشفة: ${archDate}</div>`;
                    } else {
                        const currentRoleName = this.roles[STEPS[o.status].role];
                        roleDisplay = `<div class="role-badge"><i class="fas fa-user-clock"></i> مطلوب: ${currentRoleName}</div>`;
                    }

                    STEPS.forEach((s, i) => {
                        let cls = '';
                        if(i < o.status) cls = 'completed';
                        else if(i === o.status && !isDone) cls = 'current';
                        
                        let fileHTML = '';
                        if(o.files && o.files[i]) {
                             const filesArr = Array.isArray(o.files[i]) ? o.files[i] : [o.files[i]];
                             filesArr.forEach((f, fx) => {
                                 fileHTML += `<div class="file-link" onclick="sys.dl(${o.id},${i},${fx})"><i class="fas fa-paperclip"></i> ${f.name.substring(0,8)}..</div>`;
                             });
                        }

                        timelineHTML += `
                        <div class="h-step ${cls}">
                            <div class="icon-circle"><i class="fas ${s.icon}"></i></div>
                            <div class="h-title">${s.title}</div>
                            <div class="h-role">${this.roles[s.role]}</div>
                            ${fileHTML}
                        </div>`;
                    });

                    // PO Files
                    let poFilesHTML = '';
                    if(o.poFiles) {
                         const pf = Array.isArray(o.poFiles) ? o.poFiles : [o.poFiles];
                         poFilesHTML = `<div style="display:flex; flex-direction:column; align-items:center; gap:3px;">`;
                         pf.forEach((f, fx) => {
                             poFilesHTML += `<div class="file-link" style="background:#fce7f3; color:#be185d" onclick="sys.dlPO(${o.id},${fx})"><i class="fas fa-file-contract"></i> PO</div>`;
                         });
                         poFilesHTML += `</div>`;
                    }

                    let actionBtn = '';
                    if(!isDone) {
                        actionBtn = `<button class="btn-action-do" onclick="sys.openAct(${o.id})">🚀 تنفيذ: ${STEPS[o.status].title}</button>`;
                    }

                    const html = `
                    <div class="order-row ${isDone?'done-row':''} ${this.filter==='done'?'expanded':''}" id="row-${o.id}">
                        <div class="row-header" onclick="sys.toggleRow(${o.id})">
                            
                            <div class="cell-main">
                                <span class="client-txt">${o.client}</span>
                                <span class="ref-txt">${o.ref}</span>
                            </div>
                            
                            <div style="display:flex; flex-direction:column; gap:5px;">
                                <div class="info-badge"><i class="fas fa-map-pin"></i> ${o.loc}</div>
                                <div class="info-badge"><i class="fas fa-clock"></i> تسليم: ${this.formatDateArabic(o.delDate)}</div>
                            </div>

                            <div style="text-align:center">
                                ${isDone ? '' : this.getRemainingTime(o.delDate)} </div>
                            
                            <div style="text-align:center; display:flex; flex-direction:column; align-items:center; gap:5px;">
                                <span class="status-badge ${isDone?'badge-done':'badge-active'}">
                                    ${isDone ? '<i class="fas fa-check"></i> مكتمل' : STEPS[o.status].title}
                                </span>
                                ${roleDisplay}
                            </div>
                            
                            <div style="text-align:center; color:#ccc"><i class="fas fa-chevron-down"></i></div>
                        </div>
                        <div class="row-details"><div class="details-content">
                            <div class="h-timeline">
                                <div class="h-step completed">
                                    <div class="icon-circle" style="background:#be185d; border-color:#be185d; color:white"><i class="fas fa-file-invoice"></i></div>
                                    <div class="h-title">أمر الشراء</div>
                                    <div class="h-role">${this.roles.sales}</div>
                                    ${poFilesHTML}
                                </div>
                                ${timelineHTML}
                            </div>
                            <div class="action-bar">
                                <button onclick="sys.deleteOrder(${o.id})" style="background:#fee2e2; color:#b91c1c; border:none; padding:10px 20px; border-radius:15px; font-weight:bold; cursor:pointer; margin-right:auto">🗑️ حذف</button>
                                ${actionBtn}
                            </div>
                        </div></div>
                    </div>`;
                    listEl.insertAdjacentHTML('beforeend', html);
                });
            },

            // --- Logic Functions ---
            toggleRow: function(id) {
                const r = document.getElementById(`row-${id}`);
                const open = r.classList.contains('expanded');
                document.querySelectorAll('.order-row').forEach(x => x.classList.remove('expanded'));
                if(!open) r.classList.add('expanded');
            },
            
            openNew: function() {
                document.getElementById('modal-order').style.display='flex';
                document.getElementById('modal-title').innerText="✨ طلب جديد";
                ['o-client','o-ref','o-loc','o-date'].forEach(k => document.getElementById(k).value='');
                document.getElementById('o-file').value='';
                document.getElementById('o-id').value='';
            },
            
            saveOrder: async function() {
                const id = document.getElementById('o-id').value;
                const d = {
                    client: document.getElementById('o-client').value,
                    ref: document.getElementById('o-ref').value,
                    loc: document.getElementById('o-loc').value,
                    delDate: document.getElementById('o-date').value
                };
                if(!d.client) return alert("⚠️ البيانات ناقصة!");

                if(id) { /* Edit logic if needed */ } 
                else {
                    const files = document.getElementById('o-file').files;
                    if(files.length===0) return alert("⚠️ فين ملف الـ PO؟");
                    
                    const pFiles = [];
                    for(let i=0; i<files.length; i++) {
                        pFiles.push({ name: files[i].name, data: await this.toBase64(files[i]) });
                    }
                    
                    const newId = Date.now();
                    const obj = { ...d, id: newId, ts: newId, status: 0, poFiles: pFiles, files: [] };
                    set(ref(db, 'erp_pro/orders/'+newId), obj).then(()=>sys.closeModal('modal-order'));
                }
            },
            
            openAct: function(id) {
                this.actId = id;
                const o = this.orders.find(x=>x.id===id);
                document.getElementById('modal-act').style.display='flex';
                document.getElementById('act-title').innerText = STEPS[o.status].title;
                document.getElementById('act-role').innerText = "المسؤول: " + this.roles[STEPS[o.status].role];
                document.getElementById('act-desc').innerText = STEPS[o.status].desc;
                document.getElementById('act-file').value='';
                
                if(o.status === 1) {
                    document.getElementById('whs-controls').style.display='block';
                    document.getElementById('act-upload-area').style.display='none';
                    this.toggleWhsOpt(true);
                } else {
                    document.getElementById('whs-controls').style.display='none';
                    document.getElementById('act-upload-area').style.display='block';
                    this.whsNoChange = false;
                }
            },

            toggleWhsOpt: function(val) {
                this.whsNoChange = val;
                const setStyle = (id, active) => {
                    const el = document.getElementById(id);
                    el.style.background = active ? '#d1fae5' : '#fff';
                    el.style.borderColor = active ? '#10b981' : '#eee';
                    el.querySelector('.chk').style.background = active ? '#10b981' : 'transparent';
                };
                setStyle('opt-no-change', val);
                setStyle('opt-change', !val);
                document.getElementById('act-upload-area').style.display = val ? 'none' : 'block';
            },

            submitAct: async function() {
                const o = this.orders.find(x=>x.id===this.actId);
                let nextSt = o.status + 1;
                let nFiles = [...(o.files||[])];

                if(this.whsNoChange && o.status === 1) {
                    const base = o.files[0];
                    nFiles[1] = base.map(f=>({...f, name: "(تم الفحص) "+f.name}));
                    nFiles[2] = base.map(f=>({...f, name: "(نهائي تلقائي) "+f.name}));
                    nextSt = 3; 
                } else {
                    const fls = document.getElementById('act-file').files;
                    if(fls.length===0) return alert("⚠️ لازم ترفع الملفات!");
                    const arr = [];
                    for(let i=0; i<fls.length; i++) arr.push({name:fls[i].name, data:await this.toBase64(fls[i])});
                    nFiles[o.status] = arr;
                }
                
                // --- ARCHIVE LOGIC ---
                let updateData = { status: nextSt, files: nFiles };
                if(nextSt >= 6) { // Completed
                    updateData.archivedAt = Date.now();
                }

                update(ref(db, 'erp_pro/orders/'+o.id), updateData)
                .then(()=>sys.closeModal('modal-act'));
            },

            deleteOrder: function(id) {
                const p = prompt("🔑 الرقم السري للحذف:");
                if(p==="20002000") {
                    if(confirm("متأكد؟ هيمسح كل حاجة!")) remove(ref(db, 'erp_pro/orders/'+id));
                } else if(p) alert("❌ غلط!");
            },

            // Utils
            closeModal: function(id) { document.getElementById(id).style.display='none'; },
            toBase64: f=>new Promise(r=>{const d=new FileReader();d.readAsDataURL(f);d.onload=()=>r(d.result)}),
            dl: function(id,s,f) { 
                const o = this.orders.find(x=>x.id===id);
                const fs = Array.isArray(o.files[s]) ? o.files[s] : [o.files[s]];
                this.down(fs[f]); 
            },
            dlPO: function(id,f) {
                const o = this.orders.find(x=>x.id===id);
                const fs = Array.isArray(o.poFiles) ? o.poFiles : [o.poFiles];
                this.down(fs[f]);
            },
            down: function(f) { const a=document.createElement('a'); a.href=f.data; a.download=f.name; a.click(); },
            
            openSettings: function() { 
                document.getElementById('modal-settings').style.display='flex'; 
                document.getElementById('s-sales').value=this.roles.sales;
                document.getElementById('s-acc').value=this.roles.acc; 
                document.getElementById('s-whs').value=this.roles.whs; 
            },
            saveSettings: function() { 
                this.roles={sales:document.getElementById('s-sales').value, acc:document.getElementById('s-acc').value, whs:document.getElementById('s-whs').value}; 
                localStorage.setItem('erp_roles_v3',JSON.stringify(this.roles)); 
                this.closeModal('modal-settings'); this.render(); 
            },
            setFilter: function(f) { this.filter=f; this.updateMenuUI(); this.render(); },
            updateMenuUI: function() {
                document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
                document.getElementById(this.filter==='active'?'btn-active':'btn-done').classList.add('active');
            }
        };

        sys.init();
        onValue(ref(db, 'erp_pro/orders'), snap => { sys.orders = snap.val() ? Object.values(snap.val()) : []; sys.render(); });
    </script>
</body>
</html>
